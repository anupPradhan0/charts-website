# Local PostgreSQL for development and tests.
#
# Credentials come from `.env` (Compose reads it automatically) and fall back to
# development-only defaults. Nothing here is intended for production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: numera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-numera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numera}
      POSTGRES_DB: ${POSTGRES_DB:-numera}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - numera-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numera} -d ${POSTGRES_DB:-numera}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  numera-pgdata:
